# =============================================================================
# waf_snippets.conf - mitigasi level-pemicu CVE-2026-109618/109619 (PHP2Shell)
#
# Pemicu utama kedua CVE = request multipart/form-data (upload). Memblokirnya
# SEBELUM sampai ke PHP adalah lapisan mitigasi paling kuat.
#
# PERINGATAN DAMPAK: aturan ini akan MEMATAHKAN SEMUA fitur upload file
# (form dengan <input type=file>, admin CMS, upload media, sebagian API).
# Terapkan HANYA pada host/path yang tidak butuh upload, atau kecualikan
# path upload yang sah. Catatan dari riset: batas UKURAN upload TIDAK menolong.
#
# Pilih SATU sesuai web server Anda. Uji di staging dulu.
# =============================================================================

# -----------------------------------------------------------------------------
# [A] NGINX - tolak multipart/form-data (HTTP 403)
# Taruh di dalam server{} atau location{} terkait.
# -----------------------------------------------------------------------------
#   location / {
#       if ($content_type ~* "multipart/form-data") { return 403; }
#       # ... config lain ...
#   }
#
# Jika ada path upload sah yang harus dikecualikan:
#   location = /admin/upload { ... izinkan ... }
#   location / { if ($content_type ~* "multipart/form-data") { return 403; } }

# -----------------------------------------------------------------------------
# [B] APACHE (mod_headers/mod_rewrite) - tolak multipart/form-data
# -----------------------------------------------------------------------------
#   <IfModule mod_rewrite.c>
#       RewriteEngine On
#       RewriteCond %{CONTENT_TYPE} multipart/form-data [NC]
#       RewriteRule .* - [F,L]
#   </IfModule>

# -----------------------------------------------------------------------------
# [C] MODSECURITY (WAF) - blok multipart kecuali path yang diizinkan
# Sesuaikan ID aturan agar tidak bentrok.
# -----------------------------------------------------------------------------
#   SecRule REQUEST_HEADERS:Content-Type "@rx multipart/form-data" \
#       "id:1092026,phase:1,deny,status:403,log,\
#        msg:'PHP2Shell mitigation: multipart blocked',\
#        chain"
#       SecRule REQUEST_URI "!@beginsWith /admin/upload" "t:lowercase"

# -----------------------------------------------------------------------------
# [D] CLOUDFLARE / WAF cloud (konsep aturan)
#   (http.request.method eq "POST" and
#    any(http.request.headers["content-type"][*] contains "multipart/form-data"))
#   and not http.request.uri.path contains "/upload"   => Block
# -----------------------------------------------------------------------------

# Setelah menerapkan, verifikasi: request upload sah tetap jalan di path yang
# dikecualikan, dan multipart ke endpoint lain mendapат 403.
